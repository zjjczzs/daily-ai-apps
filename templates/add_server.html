{% extends "base.html" %}

{% block title %}添加服务器{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">添加 MCP 服务器</h1>
        <p class="text-gray-600 mt-2">配置新的 MCP 服务器到您的 Hub</p>
    </div>

    <div class="bg-white rounded-xl shadow-md p-8">
        <form method="POST" action="/add" class="space-y-6">
            <!-- 基本信息 -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                    服务器名称 <span class="text-red-500">*</span>
                </label>
                <input type="text" id="name" name="name" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                       placeholder="例如: My Custom MCP">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                <textarea id="description" name="description" rows="3"
                          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                          placeholder="描述这个服务器的功能..."></textarea>
            </div>

            <!-- 传输方式 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-3">传输方式</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="transport" value="stdio" checked 
                               class="sr-only peer" onchange="toggleTransport()">
                        <div class="p-4 border-2 border-gray-200 rounded-lg peer-checked:border-purple-500 peer-checked:bg-purple-50 transition">
                            <div class="flex items-center mb-2">
                                <svg class="w-6 h-6 text-gray-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                                <span class="font-semibold">Stdio</span>
                            </div>
                            <p class="text-sm text-gray-500">标准输入输出，适合本地进程</p>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="transport" value="sse" 
                               class="sr-only peer" onchange="toggleTransport()">
                        <div class="p-4 border-2 border-gray-200 rounded-lg peer-checked:border-purple-500 peer-checked:bg-purple-50 transition">
                            <div class="flex items-center mb-2">
                                <svg class="w-6 h-6 text-gray-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                                </svg>
                                <span class="font-semibold">SSE</span>
                            </div>
                            <p class="text-sm text-gray-500">Server-Sent Events，适合远程服务</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- 连接配置 -->
            <div id="stdio-config">
                <label for="command" class="block text-sm font-medium text-gray-700 mb-1">命令</label>
                <input type="text" id="command" name="command"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent font-mono text-sm"
                       placeholder="例如: npx -y @modelcontextprotocol/server-filesystem /path">
                <p class="text-sm text-gray-500 mt-1">启动 MCP 服务器的命令</p>
            </div>

            <div id="sse-config" class="hidden">
                <label for="url" class="block text-sm font-medium text-gray-700 mb-1">SSE URL</label>
                <input type="url" id="url" name="url"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                       placeholder="例如: http://localhost:3000/sse">
                <p class="text-sm text-gray-500 mt-1">SSE 端点地址</p>
            </div>

            <!-- 分类和标签 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                    <select id="category" name="category"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="custom">自定义</option>
                        <option value="documentation">文档</option>
                        <option value="integration">集成</option>
                        <option value="utility">工具</option>
                        <option value="database">数据库</option>
                        <option value="automation">自动化</option>
                    </select>
                </div>
                <div>
                    <label for="tags" class="block text-sm font-medium text-gray-700 mb-1">标签</label>
                    <input type="text" id="tags" name="tags"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                           placeholder="用逗号分隔，如: ai, tool, api">
                </div>
            </div>

            <!-- 按钮 -->
            <div class="flex space-x-4 pt-4">
                <button type="submit" 
                        class="flex-1 bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition">
                    添加服务器
                </button>
                <a href="/" 
                   class="px-6 py-3 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition">
                    取消
                </a>
            </div>
        </form>
    </div>

    <!-- 帮助信息 -->
    <div class="mt-8 bg-blue-50 rounded-xl p-6">
        <h3 class="text-blue-900 font-semibold mb-2 flex items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            提示
        </h3>
        <ul class="text-blue-800 text-sm space-y-1 list-disc list-inside">
            <li>Stdio 方式需要本地安装相应的 MCP 服务器包</li>
            <li>SSE 方式需要 MCP 服务器提供 HTTP 端点</li>
            <li>可以在 <a href="https://github.com/modelcontextprotocol/servers" target="_blank" class="underline">MCP官方仓库</a> 找到更多服务器</li>
        </ul>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function toggleTransport() {
    const transport = document.querySelector('input[name="transport"]:checked').value;
    if (transport === 'stdio') {
        document.getElementById('stdio-config').classList.remove('hidden');
        document.getElementById('sse-config').classList.add('hidden');
    } else {
        document.getElementById('stdio-config').classList.add('hidden');
        document.getElementById('sse-config').classList.remove('hidden');
    }
}
</script>
{% endblock %}
