<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxNote - 轻量级语音笔记</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🎙️ VoxNote</h1>
                <p class="tagline">轻量级语音笔记</p>
            </div>
            <div class="notes-list" id="notesList">
                <div class="empty-state">暂无笔记，开始录音吧！</div>
            </div>
            <div class="sidebar-footer">
                <button class="btn btn-secondary" onclick="exportAllNotes()">📥 导出全部</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="toolbar">
                <div class="language-selector">
                    <select id="languageSelect">
                        <option value="zh-CN">中文</option>
                        <option value="en-US">English</option>
                        <option value="ja-JP">日本語</option>
                        <option value="ko-KR">한국어</option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn btn-icon" onclick="clearCurrent()" title="清空">🗑️</button>
                    <button class="btn btn-icon" onclick="copyToClipboard()" title="复制">📋</button>
                </div>
            </div>

            <div class="editor-area">
                <textarea 
                    id="noteEditor" 
                    placeholder="点击麦克风按钮开始语音输入，或在此直接输入文字..."
                    spellcheck="false"
                ></textarea>
            </div>

            <div class="recording-bar">
                <button id="recordBtn" class="record-btn" onclick="toggleRecording()">
                    <span class="mic-icon">🎤</span>
                    <span class="record-text">开始录音</span>
                </button>
                <div class="recording-status" id="recordingStatus"></div>
                <div class="shortcut-hint">按 <kbd>Space</kbd> 快速录音</div>
            </div>
        </main>
    </div>

    <!-- 导出模态框 -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <h3>导出笔记</h3>
            <div class="export-options">
                <button class="btn btn-primary" onclick="exportNotes('md')">Markdown (.md)</button>
                <button class="btn btn-primary" onclick="exportNotes('txt')">纯文本 (.txt)</button>
                <button class="btn btn-primary" onclick="exportNotes('json')">JSON (.json)</button>
            </div>
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
